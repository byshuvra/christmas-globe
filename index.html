<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frostglobe — an interactive ASCII snow globe</title>
<style>
:root{--bg:#04060b;--fg:#cbd5e1;--dim:#64748b;--btn:#0b1220cc;--line:#26324a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#04060b;--fg:#cbd5e1;--dim:#64748b;--btn:#0b1220cc;--line:#26324a}}
:root[data-theme="dark"]{--bg:#04060b;--fg:#cbd5e1;--dim:#64748b;--btn:#0b1220cc;--line:#26324a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
#h2{position:absolute;left:14px;top:calc(100% + 2px);color:#e8d9a0;font-size:11.5px;line-height:1.5;max-width:min(58vw,420px);white-space:normal}
#h2[hidden]{display:none}
#hn,#hs{font-size:10.5px;color:var(--dim);letter-spacing:0;line-height:1.5;background:linear-gradient(100deg,#64748b 0%,#64748b 30%,#e9d9a4 46%,#fffbe8 51%,#e9d9a4 56%,#64748b 72%,#64748b 100%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:hxshimmer 6s linear infinite}
@media (max-width:640px){
 #h0{max-width:calc(100vw - 132px)}
 #hn,#hs{font-size:10px}
}
#hx{position:fixed;right:14px;top:calc(9px + env(safe-area-inset-top,0px));z-index:6;
 font:10.5px/1 ui-monospace,Menlo,Consolas,monospace;text-decoration:none;
 padding:5px 9px 6px;border-radius:999px;border:1px solid #1d2637;background:#0b1220aa;
 background-clip:padding-box;transition:border-color .25s,background-color .25s}
#hx span{background:linear-gradient(100deg,#64748b 0%,#64748b 30%,#e9d9a4 46%,#fffbe8 51%,#e9d9a4 56%,#64748b 72%,#64748b 100%);
 background-size:280% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
 animation:hxshimmer 6s linear infinite}
@keyframes hxshimmer{0%{background-position:170% 0}100%{background-position:-70% 0}}
#hx:hover{border-color:#3a4a63;background-color:#111b2c}
#hx:focus-visible{outline:2px solid #e9d9a4;outline-offset:2px}
@media (prefers-reduced-motion:reduce){#hx span,#hn,#hs{animation:none;color:#cbd5e1;-webkit-text-fill-color:#cbd5e1}}
#foot{position:fixed;left:0;right:0;bottom:calc(120px + env(safe-area-inset-bottom,0px));
 display:flex;justify-content:space-between;align-items:baseline;gap:12px;
 padding:0 14px;font-size:9.5px;line-height:1.4;pointer-events:none;z-index:2;
 color:#3f4a5e;text-shadow:0 1px 6px #04060b,0 0 10px #04060b}
#h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#hcrumb{white-space:nowrap;flex:none;letter-spacing:.02em}
@media (max-width:480px){
 #bar{gap:6px;padding:0 8px calc(12px + env(safe-area-inset-bottom,0px))}
 #bar button{font-size:10px;padding:7px 9px}
 #bm{min-width:94px}#bsnd{min-width:86px}#bg{min-width:118px}
}

#h1.from{color:#cbd5e1;font-size:11.5px}
#hud{position:fixed;left:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;font-size:10.5px;line-height:1.5;color:var(--dim);pointer-events:none;text-shadow:0 1px 6px #04060b,0 0 14px #04060b;z-index:3}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--btn);border:1px solid var(--line);color:var(--fg);padding:7px 14px;border-radius:999px;font:12px/1 ui-monospace,Menlo,Consolas,monospace;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
#hint{position:fixed;left:0;right:0;bottom:calc(144px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11px;color:#94a3b8;pointer-events:none;transition:opacity 1s;padding:0 18px;text-shadow:0 1px 8px #04060b,0 0 18px #04060b}
@media (max-height:520px){#hint{display:none}}
#hint.off{opacity:0}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 10px calc(14px + env(safe-area-inset-bottom,0px))}
button{font:inherit;font-size:11px;color:var(--fg);background:var(--btn);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;touch-action:manipulation;backdrop-filter:blur(6px)}
button:hover{border-color:#5eead4}
button:active{transform:scale(.96)}
#wish{position:fixed;left:0;right:0;bottom:calc(100px + env(safe-area-inset-bottom,0px));display:none;gap:8px;justify-content:center;padding:0 14px}
#wi{font:inherit;font-size:16px;color:var(--fg);background:var(--btn);border:1px solid var(--line);border-radius:999px;padding:9px 16px;width:min(66vw,320px);user-select:text;-webkit-user-select:text;-webkit-touch-callout:default;outline:none}
#wi:focus{border-color:#5eead4}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="An interactive ASCII snow globe: a fir tree inside a glass dome, with falling snow. Drag to spin, sweep to push the snow, tap for a ripple, hold to shake."></canvas>
<div id="hud"><div id="h0"><span id="hn">Christmas Globe</span><span id="hs"> — An interactive ASCII holiday scene</span></div><div id="h2" hidden></div></div>
<div id="foot"><div id="h1"></div><div id="hcrumb"></div></div>
<a id="hx" href="https://x.com/shuvramotion" target="_blank" rel="noopener noreferrer" aria-label="Shuvra Sengupta on X, @shuvramotion"><span>@shuvramotion</span></a>
<div id="toast" role="status" aria-live="polite"></div>
<div id="hint" role="status">drag to spin · sweep through the snow · tap to send a light ripple · hold to shake · write a wish</div>
<div id="wish"><input id="wi" maxlength="28" placeholder="type a wish…" autocomplete="off"><button id="wg">✦ send</button></div>
<div id="bar"><button id="bw">write a wish</button><button id="bs">shake</button><button id="bg">glyphs · classic</button><button id="bm">mood · pine</button><button id="bsnd" aria-pressed="true" aria-label="sound">sound · on</button>
<button id="bsh" aria-label="send this globe to someone">send</button><button id="bpo" aria-label="save this frame as an image">poster · png</button></div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=$('#c'),ctx=cv.getContext('2d',{alpha:false});
const TAU=Math.PI*2,CAM=5.4,CY=.60,DR=1.12,H=1.46;
let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
const gauss=()=>Math.sqrt(-2*Math.log(rnd()||1e-6))*Math.cos(TAU*rnd());
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- glyph sets & moods ---------- */
const RAMPS={
 classic:Array.from(" .'`^\",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$"),
 kana:Array.from(" .･ｰｯｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ"),
 braille:Array.from(" ⠁⠂⠄⠈⠐⠠⠃⠅⠉⠑⠡⠇⠏⠟⠿⡿⣿"),
 blocks:Array.from(" .:·░▒▓█")};
const RN=Object.keys(RAMPS);let ri=0,RA=RAMPS.classic;
// the wish always builds its letters from its own ramp: a wish rendered in
// 'classic' used to be random density characters, which is why it was unreadable
const WISH_RA=RAMPS.braille;
const MOODS=[
 // tint multiplies the whole scene (needles, branches, ground).
 // aur  is the ribbon colour pair above the crown.
 // lt   is the bulb palette, cycled across the tree.
 {n:'pine', tint:[.86,1.12,.92],
  aur:[[40,220,140],[90,120,255]],
  lt:[[255,236,180],[255,200,60],[255,80,80],[80,235,255],[90,250,140]]},
 {n:'frost',tint:[.55,.85,2.05],
  aur:[[90,205,255],[200,130,255]],
  lt:[[225,242,255],[110,195,255],[175,155,255],[255,255,255],[150,230,255]]},
 {n:'ember',tint:[2.05,.72,.32],
  aur:[[255,140,40],[255,60,140]],
  lt:[[255,180,80],[255,110,40],[255,70,110],[255,230,160],[255,150,60]]}];
let mi=0,M=MOODS[0];

/* ---------- scene: point cloud ---------- */
const SNOW=0,WOOD=1,NEEDLE=2,BALL=3,LIGHT=4,STAR=5;
const pts=[],tips=[],dome=[];
function add(x,y,z,nx,ny,nz,r,g,b,k,ph,sh,ci){const l=Math.hypot(nx,ny,nz)||1;pts.push({x,y,z,nx:nx/l,ny:ny/l,nz:nz/l,r,g,b,k,ph:ph||0,sh:sh||0,ci:ci||0,t0:(y+.25)*.9+rnd()*.15})}
/* ---------- growth: the globe fills up as you play ---------- */
// Two kinds of growth. A tap plants a gift where you touched it; a slow timer
// blooms ornaments on the branches so the tree keeps decorating itself.
// Everything is remembered so the globe survives a reload.
// ---------- identity ----------
// The name shown at the top, the author credit, and the year. Change them here.
const SITE={
 name:'Christmas Globe',
 sub:'An interactive ASCII holiday scene',
 by:'Shuvra Sengupta',
 x:'shuvramotion',
 year:2026
};
let SEED=null;
try{SEED=window.FROST_SEED||null}catch(e){}
if(!SEED){try{const raw=localStorage.getItem('frostglobe.seed.v1');if(raw)SEED=JSON.parse(raw)}catch(e){}}
const GKEY='frostglobe.growth.v1';
let growth={taps:0,gifts:[],orns:[]};
try{const g=JSON.parse(localStorage.getItem(GKEY));if(g&&g.gifts&&!SEED)growth=g}catch(e){}
if(SEED&&SEED.gifts)growth={taps:SEED.taps||0,gifts:SEED.gifts,orns:SEED.orns||[]};
if(SEED&&SEED.from)window.__from=SEED.from;
const saveGrowth=()=>{try{localStorage.setItem(GKEY,JSON.stringify(growth))}catch(e){}};

// A shared globe carries its decorations and its wish inside the file itself,
// so the recipient needs no server and no storage. Two channels:
//  - window.FROST_SEED  : the structured data (gifts/ornaments/wish/name)
//  - localStorage       : the same data on reload, so it survives
let toastT=0;
function flash(msg,ms){
 const t=document.getElementById('toast');
 if(!t)return;
 t.textContent=msg;t.classList.add('on');
 clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms||2400);
}
function saveBlob(blob,name){
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download=name;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
const download=()=>{
 const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
 const blob=new Blob([html],{type:'text/html'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download=(SEED&&SEED.from?SEED.from.replace(/[^\w.-]+/g,'-')+'-':'')+'christmas-globe.html';
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),4000);
};
// strip anything that would make the copy look mid-interaction
function serialise(){
 const clone=document.documentElement.cloneNode(true);
 clone.querySelectorAll('canvas').forEach(c=>{
  const ctx=c.getContext&&c.getContext('2d');
  if(ctx)ctx.clearRect(0,0,c.width,c.height);
 });
 const wi=clone.querySelector('#wi');if(wi)wi.value='';
 const wp=clone.querySelector('#wish');if(wp)wp.style.display='none';
 const hint=clone.querySelector('#hint');if(hint)hint.classList.remove('off');
 return '<!DOCTYPE html>\n'+clone.outerHTML;
}

// World position of a screen point ON THE GLASS.
// The projection divides by (CAM-rz), so screen radius and depth are coupled.
// A plain sphere raycast was wrong here: at this camera distance the true
// sphere projects to a small disc well inside the drawn silhouette. Instead
// solve the front-surface depth directly, iterating to the fixed point.
function worldAt(px,py){
 const a=(px/cellW-cols*.5)/bs;        // rx * gp * 1.8
 const b=-(py/cellH-cyPx/cellH)/bs;    // ry * gp
 const rmax=Math.max(DR*1.30,(bs*DR*1.9/bs)); // generous: same disc the ripple uses
 if(Math.hypot(a,b)>rmax*1.6)return null;
 let rz=0,gp=1,rx=0,ry=0;
 for(let k=0;k<8;k++){
  gp=CAM/(CAM-rz); rx=a/(gp*1.8); ry=b/gp;
  const nz=Math.sqrt(Math.max(0,1-(rx*rx+ry*ry)/(DR*DR)))*DR*.62;
  if(Math.abs(nz-rz)<1e-5){rz=nz;break}
  rz=nz;
 }
 gp=CAM/(CAM-rz); rx=a/(gp*1.8); ry=b/gp;
 if((rx*rx+ry*ry)/(DR*DR)>1)return null;
 const yy=ry*cp+rz*sp, r1=-ry*sp+rz*cp;   // invert P() exactly
 return {x:rx*ca+r1*sa,y:yy+CY,z:-rx*sa+r1*ca};
}
// screen-space bounds of the dome, for the ripple mask and tap rejection
function domeScreen(){return {cx:cols*.5,cy:cyPx/cellH,r:bs*DR*1.35}}

const GIFT_COLS=[[.85,.16,.2],[.2,.5,.95],[1,.78,.18],[.95,.95,1],[.35,.8,.5]];
function addGift(px,py){
 const w=worldAt(px,py);if(!w)return false;
 if(w.y>.42)return null;               // tapped up in the branches: no floor there
 const c=GIFT_COLS[growth.gifts.length%GIFT_COLS.length];
 // gifts rest on the snow; a tap high in the globe lands on the outer ring
 // pull boxes in from the rim: the outermost ring of snow is seen edge-on and
 // swallows anything sitting on it
 const rr=Math.hypot(w.x,w.z), maxR=.70, k=rr>maxR?maxR/rr:1;
 growth.gifts.push({x:+(w.x*k).toFixed(3),y:+.045,z:+(w.z*k).toFixed(3),c,t0:+T.toFixed(2)});
 if(growth.gifts.length>42)growth.gifts.shift();
 saveGrowth();return true}
// Hang an ornament on a real branch tip, picking the one nearest a target
// point -- so tapping a branch decorates that branch.
function addOrnament(px,py){
 let tgt=null;
 if(px!==undefined){tgt=worldAt(px,py)}
 let best=null,bd=1e9;
 for(const t of tips){
  if(t.f>.94)continue;                       // skip the very top whorl
  let d;
  if(tgt){const dx=t.x-tgt.x,dy=t.y-tgt.y,dz=t.z-tgt.z;d=dx*dx+dy*dy+dz*dz}
  else d=rnd()*4;                            // self-decoration wanders
  if(d<bd){bd=d;best=t}
 }
 if(!best)return;
 if(growth.orns.some(o=>Math.abs(o.x-best.x)<.02&&Math.abs(o.y-best.y)<.02))return;
 const tl=.94, x=best.x*tl, y=best.y, z=best.z*tl;
 growth.orns.push({x:+x.toFixed(3),y:+(y-.02).toFixed(3),z:+z.toFixed(3),
   c:GIFT_COLS[(growth.orns.length+2)%GIFT_COLS.length],t0:+T.toFixed(2)});
 if(growth.orns.length>60)growth.orns.shift();saveGrowth();
}

/* ---------- sound: Jingle Bells on a chime, sleigh bells on top ---------- */
// Created lazily on the first gesture: browsers block AudioContext before that.
let AC=null,honk=true;
function audio(){if(!honk)return null;
 if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C){honk=false;return null}
  try{AC=new C()}catch(e){honk=false;return null}}
 if(AC.state==='suspended')AC.resume().catch(()=>{});
 return AC}

const sfx={on:true,master:null,verb:null,ambGain:null};
// one shared bus with a small synthetic room, so taps and ambience sit together
function sfxBus(ac){
 if(sfx.master&&sfx.master.context===ac)return sfx.master;
 const m=ac.createGain();m.gain.value=.9;
 // gentle glue, not a brick wall: a hard ratio here squashed the quiet bed
 const glue=ac.createDynamicsCompressor();
 glue.threshold.value=-20;glue.knee.value=24;glue.ratio.value=2.5;
 glue.attack.value=.006;glue.release.value=.25;
 // the limiter sits last, after the reverb return, so nothing can clip
 const lim=ac.createDynamicsCompressor();
 lim.threshold.value=-1.5;lim.knee.value=0;lim.ratio.value=4;
 lim.attack.value=.002;lim.release.value=.12;window.__lim=lim;
 // a short convolver impulse: a few early reflections is enough to sound like
 // a room rather than a dry beep
 const ir=ac.createBuffer(2,Math.floor(ac.sampleRate*.9),ac.sampleRate);
 for(let c=0;c<2;c++){const d=ir.getChannelData(c);
  for(let i=0;i<d.length;i++){const t=i/d.length;d[i]=(Math.random()*2-1)*Math.pow(1-t,2.6)*.5}}
 const conv=ac.createConvolver();conv.buffer=ir;
 const wet=ac.createGain();wet.gain.value=.18;
 m.connect(glue);glue.connect(lim);lim.connect(ac.destination);
 conv.connect(wet);wet.connect(lim);
 const ag=ac.createGain();ag.gain.value=0.55;ag.connect(m);   // the bed's own level
 sfx.master=m;sfx.verb=conv;sfx.ambGain=ag;
 return m}

// Jingle Bells, the tune everyone knows, in the key of C.
// [semitones above C major tonic, beats]. The phrase that every tap plays.
const SONG={
  head:[[4,1],[4,1],[4,2]],
  tail:[[4,1],[4,1],[4,2],[4,1],[7,1],[0,2],[2,2],[4,4]],
  dash:[[7,1],[7,1],[7,1],[7,1],[7,1],[4,1],[4,1],[4,1],[4,2],[2,1],[2,1],[4,1],[2,2],[7,2]],
};
const PHRASE=SONG.head.concat(SONG.tail);
const TONIC=523.25;                                  // C5
const hz=(semi)=>TONIC*Math.pow(2,semi/12);

// a small struck chime: fundamental plus two quiet partials, fast attack
function chime(ac,dest,t,freq,dur,gain){
 const g=ac.createGain();
 g.gain.setValueAtTime(.0001,t);
 g.gain.linearRampToValueAtTime(gain,t+.008);
 g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 // fundamental carries the melody; the partials are only colour. At 0.22 the
 // octave was louder than the note it was colouring, so the tune came out an
 // octave up and muddy.
 const parts=[[1,1],[2.01,.10],[3.02,.035]];
 for(const [mul,amp] of parts){
  const o=ac.createOscillator(),og=ac.createGain();
  o.type='sine';o.frequency.value=freq*mul;og.gain.value=amp;
  o.connect(og);og.connect(g);o.start(t);o.stop(t+dur+.05)}
 // Dry into `dest`, and the reverb send *also* through dest's path: sending
 // g straight to sfx.verb skipped the ambience gain entirely, which is why the
 // bed stayed at a fixed level no matter what its gain was set to.
 g.connect(dest);g.connect(sfx.verb);
}

// sleigh bells: a cluster of tiny metallic strikers, a few ms apart. This is
// the shimmer that sits under the melody.
function shakeBells(ac,dest,t,root,gain,count){
 const n=count||(6+ (rnd()*2|0));
 const RAT=[1,1.125,1.25,1.5,1.6875,2];
 for(let i=0;i<n;i++){
  const o=ac.createOscillator(),gg=ac.createGain();
  o.type='triangle';
  o.frequency.value=root*RAT[i%RAT.length]*(1+(rnd()-.5)*.006)*(1.9+rnd()*.5);
  const st=t+i*(.016+rnd()*.02);
  gg.gain.setValueAtTime(.0001,st);
  gg.gain.linearRampToValueAtTime(gain*(1-i/(n+2)),st+.006);
  gg.gain.exponentialRampToValueAtTime(.0001,st+.42+rnd()*.4);
  o.connect(gg);gg.connect(dest);o.start(st);o.stop(st+.9)}
}

// ---- tap: a single gentle ting, panned and pitched by where you tapped ----
// The full phrase on every click was too much; a tap should be a small
// acknowledgement, not a performance.
let tingAt=0;
function bell(px,py){
 const ac=audio();if(!ac||!sfx.on)return;
 const bus=sfxBus(ac);
 const g=domeScreen(), top=cyPx-g.r*cellH*.55, bot=cyPx+g.r*cellH*.85;
 const hi=clamp(1-(py-top)/Math.max(60,bot-top),0,1);
 // softer and quieter than the tune underneath, so it never dominates
 const pan=ac.createStereoPanner?ac.createStereoPanner():null;
 if(pan){pan.pan.value=clamp((px-g.cx*cellW)/(g.r*cellW*1.4),-.8,.8);pan.connect(bus)}
 const dest=pan||bus;
 // two pitches a fifth apart, chosen by height: a small glassy ting
 const freq=1046.5*Math.pow(2,(Math.round(hi*5))/12);
 // a slightly varied strike, so repeated taps aren't identical
 const detune=1+(rnd()-.5)*.008;
 const t0=ac.currentTime+.008;
 // fundamental + two quiet inharmonic partials, short and clean
 [[1,1],[2.4,.16],[3.9,.05]].forEach(([mul,amp],k)=>{
  const o=ac.createOscillator(),gg=ac.createGain();
  o.type='sine';o.frequency.value=freq*mul*detune;
  gg.gain.setValueAtTime(.0001,t0);
  gg.gain.linearRampToValueAtTime(.085*amp,t0+.006);       // gentle attack
  gg.gain.exponentialRampToValueAtTime(.0001,t0+.55-k*.12);
  o.connect(gg);gg.connect(dest);gg.connect(sfx.verb);
  o.start(t0);o.stop(t0+.7);
 });
 if(window.__bellLog)window.__bellLog(Math.round(freq),hi);
}

// ---- ambience: the tune, arranged like a video game loop ----
// A square-wave lead with a light vibrato, an arpeggiated triangle bass, and a
// chip-style noise tick for a hi-hat. Same Jingle Bells, arcade palette.
let amb={on:false,next:0,step:0,pausedUntil:0};
// The renderer needs to know where the music is, sample-accurately. The
// scheduler pushes each note's start time and pitch into a short ring, and the
// frame loop reads the *audio* clock to find what is sounding right now.
const beatRing=[];{}
function pushBeat(t,semi,beats){beatRing.push({t,semi,beats,until:t+beats*AMB_BEAT});
 if(beatRing.length>64)beatRing.shift()}
// 0..1 energy of the music at audio time `now`: pulses on each note onset
function beatEnergy(now){
